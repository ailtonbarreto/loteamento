<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="earth.png" type="image/x-icon">
  <title>Loteamento Pro</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body {
      background: #f5f5f7;
      color: #111827;
      overflow-x: hidden;
    }

    /* NAVBAR FIXA */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 14px 32px;
      background: #111827;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .navbar-logo {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .btn-login {
      width: 10%;
      padding: 8px 2vw;
      border-radius: 0.5vw;
      border: none;
      cursor: pointer;
      font-weight: 600;
      background-color: #fff;
      color: #111827;
    }

    /* SEÇÕES */
    section {
      padding: 120px 32px;
      max-width: 90%;
      margin: auto;
    }

    .hero {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding-top: 160px;

      div {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: left;
      }

    }

    .hero h1 {
      font-size: 4rem;
      margin-bottom: 16px;
    }

    .hero p {
      font-size: 1.2rem;
      color: #06090c;
      margin-bottom: 24px;
    }


    /* MODAL LOGIN */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }


    .modal {
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-header {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .modal-body input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
    }

    .modal-footer {
      display: flex;
      justify-content: space-around;
      gap: 10px;
    }

    .btn-modal {
      padding: 8px 16px;
      border-radius: 0.5vw;
      border: none;
      cursor: pointer;
      width: 100%;
      color: #fff;
    }

    .btn-submit {
      background: #111827;
    }

    #btnCloseModal {
      background-color: transparent;
      color: #e40303;
      border: none;
      font-size: 2vw;
      cursor: pointer;
    }

    img {
      width: 90%;
    }

    /* ---------------------------------------------------------- */
    /* SPINNER */

    #spinner {
      display: none;
      justify-content: center;
      align-items: center;
      position: fixed;
      height: 100vh;
      width: 100vw;
      background-color: #02010160;
      z-index: 2001;
    }

    #loading {
      height: 60px;
      width: 60px;
      border: 8px solid #ffffff;
      border-top: 8px solid #111827;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }


    @media (max-width: 768px) {
      .hero {
        flex-direction: column;
        justify-content: space-around;
        text-align: center;
        height: 100vh;

        img {
          width: 90%;
        }
      }

      .hero h1 {
        font-size: 2.5rem;
        text-align: center;
      }

      .btn-login {
        width: 30%;
      }
    }

  </style>

</head>

<body>

  <div id="spinner">

    <div id="loading"></div>

  </div>


  <nav class="navbar">

    <div class="navbar-logo">Loteamento Pro</div>

    <button class="btn-login" id="btnLogin">Login</button>

  </nav>


  <section class="hero" id="hero">

    <div>

      <h1>Gestão moderna de loteamentos</h1>

    </div>

    <div>

      <img src="home_img.png" alt="">

    </div>

  </section>


  <!-- MODAL LOGIN -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="modal-header">
        <h2>Login</h2>
        <button id="btnCloseModal">&times;</button>
      </div>

      <div class="modal-body">
        <input type="text" id="nome" placeholder="Usuário" />
        <input type="password" id="senha" placeholder="Senha" />
      </div>

      <div class="modal-footer">
        <button class="btn-modal btn-submit" id="btnEntrar">Entrar</button>
      </div>
    </div>
  </div>

  <script>

    const btnLogin = document.getElementById("btnLogin");
    const btnCloseModal = document.getElementById("btnCloseModal");
    const btnEntrar = document.getElementById("btnEntrar");
    const spinner = document.getElementById('spinner');

    spinner.style.display = 'none';

    btnLogin.onclick = () => modalBackdrop.style.display = "flex";
    btnCloseModal.onclick = () => modalBackdrop.style.display = "none";


    btnEntrar.onclick = () => {
      async function login() {
        const user = document.getElementById('nome').value;
        const password = document.getElementById('senha').value;

        spinner.style.display = 'flex';

        const response = await fetch('https://api-lotes.onrender.com/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ user, password })
        });

        const data = await response.json();

        console.log("Status:", response.status);
        console.log("Resposta:", data);

        if (response.ok) {
          localStorage.setItem('nome', user);
          sessionStorage.setItem('logon', 'ok');
          sessionStorage.setItem("usuarioTipo", data.usuario.tipo);
          sessionStorage.setItem("usuarioId", data.usuario.id);
          window.location.href = "./home/home.html";


        } else {
          spinner.style.display = 'none';
        }
      }

      login();
    };


  </script>


</body>

</html>
