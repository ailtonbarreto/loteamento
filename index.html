<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="assets/earth.png" type="image/x-icon">

  <title>Loteamento Pro</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('276696983.jpg') no-repeat center center/cover;
      font-family: Arial, sans-serif;
    }

    /* ---------------------------------------------------------- */
    /* SPINNER */

    #spinner {
      display: none;
      justify-content: center;
      align-items: center;
      position: fixed;
      height: 100vh;
      width: 100vw;
      background-color: #02010160;
      z-index: 2001;
    }

    #loading {
      height: 60px;
      width: 60px;
      border: 8px solid #ffffff;
      border-top: 8px solid #111827;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 320px;
      padding: 40px;
      border-radius: 15px;


      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.3);

      text-align: center;
    }

    .container h2 {
      color: #fff;
      margin-bottom: 20px;
    }

    .container input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      outline: none;
    }

    .container button {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      border: none;
      border-radius: 8px;
      background: #ffffffcc;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    #msg {
      color: rgb(238, 156, 4);
      font-weight: bold;
      display: none;
    }

    .container button:hover {
      background: #fff;
    }

    @media (max-width: 768px) {
      .container {
        width: 80%;
        height: 35vh;
        padding: 20px;
      }

      .container input {
        width: 90%;
      }

      .container button {
        width: 90%;
      }
    }
  </style>

</head>

<body>

  <div id="spinner">

    <div id="loading"></div>

  </div>

  <div class="container">

    <h2>Login</h2>

    <form>

      <input type="text" placeholder="Usuário" id="nome">

      <input type="password" placeholder="Senha" id="senha">

      <button id="btnEntrar">Entrar</button>

      <p id="msg">Erro</p>

    </form>

  </div>

  <script src="login.js"></script>
</body>

</html>
