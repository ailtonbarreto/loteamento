<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/logo.png" type="image/x-icon">
    <title>Cadastro de Cliente</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script src="../home/js/menu.js" defer></script>
    <link rel="stylesheet" href="../home/css/menu.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!--MENU--------------------------------------------->

    <div class="header_dash_container">

        <span class="material-symbols-outlined" id="menu-toggle">menu</span>

        <h2>Cadastro de Comprador</h2>

    </div>

    <nav id="menu">

        <span class="material-symbols-outlined close-menu">close</span>

        <div style="display: flex; justify-content: center; margin-bottom: 20px;">

            <img src="../assets/logo.png" class="logo" alt="Logo">


        </div>


        <div class="menu-item" onclick="window.location.href='../home/home.html'">
            <span class="material-symbols-outlined">home</span>
            <span class="menu-label">Empreendimento 1</span>
        </div>

        <!-- Submenu-->
        <div class="menu-item active">
            <span class="material-symbols-outlined">person</span>
            <span class="menu-label">Clientes</span>
        </div>

        <div class="menu-item" onclick="window.location.href='settings.html'">
            <span class="material-symbols-outlined">settings</span>
            <span class="menu-label">Configurações</span>
        </div>

        <div class="menu-item" onclick="window.location.href='../index.html'" id="sair">
            <span class="material-symbols-outlined">logout</span>
            <span class="menu-label">Sair</span>
        </div>

    </nav>


    <div class="container">

        <form id="formCadastro">

            <div class="sub">

                <div class="campo">

                    <label>Nome Completo:</label>
                    <input type="text" id="nome" required>

                </div>

                <div class="campo">

                    <label>CPF:</label>
                    <input type="number" id="cpf" required>

                </div>

                <!-- <div class="campo">

                    <label>Estado Civil</label>
                    <select id="estado_civil">

                        <option value="solteiro">Solteiro</option>
                        <option value="casado">Casado</option>
                        <option value="divorciado">divorciado</option>

                    </select>

                </div> -->

            </div>


            <div class="sub">

                <div class="campo">

                    <label>Email:</label>
                    <input type="email" id="email" required>

                </div>

                <div class="campo">

                    <label>WhatsApp:</label>
                    <input type="text" id="telefone" required>

                </div>


            </div>

            <div class="sub">

                <div class="campo">

                    <label>Logradouro:</label>
                    <input type="text" id="endereco" required>


                </div>

                <div class="campo">

                    <label>Número:</label>
                    <input type="number" id="numero" required>

                </div>

                <div class="campo">

                    <label>Complemento:</label>
                    <input type="text" id="complemento">

                </div>



            </div>


            <div class="sub">

                <div class="campo">

                    <label>Bairro:</label>
                    <input type="text" id="bairro" required>

                </div>

                <div class="campo">

                    <label>Cidade:</label>
                    <input type="text" id="cidade" required>

                </div>

                <div class="campo">

                    <label>Estado:</label>

                    <select id="estado">
                        <option value="">Selecione um estado</option>
                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapá</option>
                        <option value="AM">Amazonas</option>
                        <option value="BA">Bahia</option>
                        <option value="CE">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Pará</option>
                        <option value="PB">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="TO">Tocantins</option>
                    </select>

                </div>

                <div class="campo">

                    <label>CEP:</label>
                    <input type="number" id="cep" required>

                </div>

            </div>

 
            <div class="sub">

                <div class="campo">

                    <label>Profissão:</label>
                    <input type="text" id="profissao" required>

                </div>

                <div class="campo">

                    <label>Renda:</label>
                    <input type="number" id="renda" required>

                </div>

            </div>

            <div class="sub">

                <button type="submit">Cadastrar</button>


            </div>


        </form>

        <p id="mensagem"></p>
    </div>

    <script>

        document.getElementById("formCadastro").addEventListener("submit", async function (e) {
            e.preventDefault();

            const dados = {
                nome: document.getElementById("nome").value,
                cpf: document.getElementById("cpf").value,
                email: document.getElementById("email").value,
                telefone: document.getElementById("telefone").value,
                logradouro: document.getElementById("endereco").value,
                numero: document.getElementById("numero").value,
                complemento: document.getElementById("complemento").value,
                bairro: document.getElementById("bairro").value,
                cidade: document.getElementById("cidade").value,
                uf: document.getElementById("estado").value,
                cep: document.getElementById("cep").value,
                profissao: document.getElementById("profissao").value,
                renda: document.getElementById("renda").value,
                id_corretor: 1
            };

            try {
                const resposta = await fetch("https://api-lotes.onrender.com/insert_cliente", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(dados)
                });

                const resultado = await resposta.json();

                document.getElementById("mensagem").innerText =
                    resposta.ok
                        ? "Cliente cadastrado com sucesso!"
                        : `Erro ao cadastrar: ${resultado.detalhe || resultado.erro}`;

            } catch (erro) {
                document.getElementById("mensagem").innerText = "Erro de conexão com o servidor";
                console.error(erro);
            }
        });


    </script>
</body>

</html>
