<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/logo.png" type="image/x-icon">
    <title>Cadastro de Cliente</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script src="../home/js/menu.js" defer></script>
    <link rel="stylesheet" href="../home/css/menu.css">
    <link rel="stylesheet" href="cliente.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div id="spinner">

        <div id="loading"></div>

    </div>

    <div class="popup_confirm_delete" style="display: none;">

        <div id="popup_confirm_delete">

            <h3>Tem Certeza que deseja excluir o cadastro?</h3>

            <div class="btns_delete">

                <button id="cancel_delete_confirm">Cancel</button>

                <button id="confirm_delete">Excluir</button>

            </div>

        </div>

    </div>

    <div class="popup_alert">

        <div id="popup_alert">

            <h3 id="popup_title">Cliente Cadastrado com Sucesso!</h3>

            <span class="material-symbols-outlined" id="icon_indicator">check</span>

            <button id="close_sucess">Ok</button>

        </div>

    </div>


    <div class="header_dash_container">

        <span class="material-symbols-outlined" id="menu-toggle">menu</span>

        <h3>Cadastro Comprador</h3>

    </div>

    <nav id="menu">

        <span class="material-symbols-outlined close-menu">close</span>

        <div style="display: flex; justify-content: center; margin-bottom: 20px;">

            <img src="../assets/logo2.png" class="logo" alt="Logo">

        </div>

        <div class="menu-item" onclick="window.location.href='../home/home.html'">
            <span class="material-symbols-outlined">home</span>
            <span class="menu-label">Empreendimento 1</span>
        </div>

        <div class="menu-item active has-submenu">
            <span class="material-symbols-outlined">person</span>
            <span class="menu-label">Clientes</span>
        </div>


        <div class="menu-item" onclick="window.location.href='settings.html'">
            <span class="material-symbols-outlined">settings</span>
            <span class="menu-label">Configurações</span>
        </div>

        <div class="menu-item" onclick="window.location.href='../index.html'" id="sair">
            <span class="material-symbols-outlined">logout</span>
            <span class="menu-label">Sair</span>
        </div>

    </nav>

    <div id="popup_cadastro" style="display: none;">

        <form id="formCadastro">

            <div class="header_popup">

                <h3>Cadastro de Comprador</h3>

                <span class="material-symbols-outlined" id="close-cadastro">close</span>

            </div>

            <div class="sub">

                <div class="campo">

                    <label>Nome Completo:</label>
                    <input type="text" id="nome" required>

                </div>

                <div class="campo">

                    <label>CPF:</label>
                    <input type="number" id="cpf" required>

                </div>

                <div class="campo">

                    <label>Sexo</label>
                    <select id="sexo" required>

                        <option value="">Selecione</option>
                        <option value="m">Masculino</option>
                        <option value="f">Feminino</option>

                    </select>

                </div>

                <div class="campo">

                    <label>Estado Civil</label>
                    <select id="estado_civil" required>
                        <option value="">Selecione</option>
                        <option value="solteiro">Solteiro</option>
                        <option value="casado">Casado</option>
                        <option value="divorciado">Divorciado</option>

                    </select>

                </div>

            </div>


            <div class="sub">

                <div class="campo">

                    <label>Email:</label>
                    <input type="email" id="email" required>

                </div>

                <div class="campo">

                    <label>WhatsApp:</label>
                    <input type="text" id="telefone" required>

                </div>


            </div>

            <div class="sub">

                <div class="campo">

                    <label>Logradouro:</label>
                    <input type="text" id="endereco" required>


                </div>

                <div class="campo">

                    <label>Número:</label>
                    <input type="number" id="numero">

                </div>

                <div class="campo">

                    <label>Complemento:</label>
                    <input type="text" id="complemento">

                </div>


            </div>


            <div class="sub">

                <div class="campo">

                    <label>Bairro:</label>
                    <input type="text" id="bairro" required>

                </div>

                <div class="campo">

                    <label>Cidade:</label>
                    <input type="text" id="cidade" required>

                </div>

                <div class="campo">

                    <label>Estado:</label>

                    <select id="estado">
                        <option value="">Selecione um estado</option>
                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapá</option>
                        <option value="AM">Amazonas</option>
                        <option value="BA">Bahia</option>
                        <option value="CE">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Pará</option>
                        <option value="PB">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="TO">Tocantins</option>
                    </select>


                </div>

                <div class="campo">

                    <label>CEP:</label>
                    <input type="number" id="cep" required>

                </div>

            </div>


            <div class="sub">

                <div class="campo">

                    <label>Profissão:</label>
                    <input type="text" id="profissao" required>

                </div>

                <div class="campo">

                    <label>Renda:</label>
                    <input type="number" id="renda" required>

                </div>

            </div>

            <div class="sub">

                <button type="submit">Cadastrar</button>


            </div>

        </form>


    </div>

    <!------------------------------------------------------------------------>

                <div class="campo">

                </div>

                <div class="campo">

            </div>


            <div class="sub">

                <div class="campo">

                    <label>Bairro:</label>
                    <input type="text" id="bairro_edit" required>

                </div>

                <div class="campo">

                    <label>Cidade:</label>
                    <input type="text" id="cidade_edit" required>

                </div>

                <div class="campo">

                    <label>Estado:</label>

                    <select id="estado_edit">
                        <option value="">Selecione um estado</option>
                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapá</option>
                        <option value="AM">Amazonas</option>
                        <option value="BA">Bahia</option>
                        <option value="CE">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Pará</option>
                        <option value="PB">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="TO">Tocantins</option>
                    </select>


                </div>

                <div class="campo">

                    <label>CEP:</label>
                    <input type="number" id="cep_edit" required>

                </div>

            </div>


            <div class="sub">

                <div class="campo">

                    <label>Profissão:</label>
                    <input type="text" id="profissao_edit" required>

                </div>

                <div class="campo">

                    <label>Renda:</label>
                    <input type="number" id="renda_edit" required>

                </div>

            </div>

            <div class="sub">

                <button type="submit">Atualizar</button>


            </div>


        </form>


    </div>


    <!------------------------------------------------------------------->


    <div class="container">

        <div class="cad">

            <h3>Compradores</h3>

            <span class="material-symbols-outlined" id="open_popup">add</span>

        </div>

        <div class="card-table">


            <table id="tabelaCliente">

                <thead>

                    <tr>
                        <th>Nome</th>
                        <th class="hide_mobile">CPF</th>
                        <th class="hide_mobile">Telefone</th>
                        <th class="hide_mobile">Cidade</th>
                        <th class="hide_mobile">Renda</th>
                        <th>Ação</th>
                    </tr>

                </thead>

                <tbody>


                </tbody>

            </table>

        </div>


    </div>




</body>

</html>
