<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <div class="container">
        <h2>Cadastro de Cliente</h2>

        <form id="formCadastro">

            <!-- DADOS PESSOAIS -->
            <label>Nome Completo:</label>
            <input type="text" id="nome" required>


            <!-- DADOS DE CONTATO -->
            <label>Email:</label>
            <input type="email" id="email" required>

            <label>WhatsApp:</label>
            <input type="text" id="telefone" required>

            <label>CPF:</label>
            <input type="number" id="cpf" required>

            <label>Logradouro:</label>
            <input type="text" id="endereco" required>

            <label>Número:</label>
            <input type="number" id="numero" required>

            <label>Complemento:</label>
            <input type="text" id="complemento">

            <label>Bairro:</label>
            <input type="text" id="bairro" required>

            <label>Cidade:</label>
            <input type="text" id="cidade" required>

            <label>Estado:</label>
            <input type="text" id="estado" required>

            <label>CEP:</label>
            <input type="number" id="cep" required>

            <label>Renda:</label>
            <input type="number" id="renda" required>

            <button type="submit">Cadastrar</button>
        </form>

        <p id="mensagem"></p>
    </div>

    <script>

        document.getElementById("formCadastro").addEventListener("submit", async function (e) {
            e.preventDefault();

            const dados = {
                nome: document.getElementById("nome").value,
                email: document.getElementById("email").value,
                telefone: document.getElementById("telefone").value,
                endereco: document.getElementById("endereco").value
            };

            try {
                const resposta = await fetch("http://localhost:3000/clientes", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(dados)
                });

                const resultado = await resposta.json();

                document.getElementById("mensagem").innerText =
                    resposta.ok ? "Cliente cadastrado com sucesso!" : "Erro ao cadastrar: " + resultado.mensagem;

            } catch (erro) {
                document.getElementById("mensagem").innerText = "Erro de conexão com o servidor";
                console.error(erro);
            }
        });

    </script>
</body>

</html>
