<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/logo.ico" type="image/x-icon">
    <title>Cadastro de Corretor</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script src="../home/js/menu.js" defer></script>
    <link rel="stylesheet" href="../home/css/menu.css">
    <link rel="stylesheet" href="../home/css/id_visual.css">
    <link rel="stylesheet" href="corretor.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div id="spinner">

        <div id="loading"></div>

    </div>

    <div class="popup_confirm_delete" style="display: none;">

        <div id="popup_confirm_delete">

            <h3>Tem Certeza que deseja excluir o cadastro?</h3>

            <div class="btns_delete">

                <button id="cancel_delete_confirm">Cancel</button>

                <button id="confirm_delete">Excluir</button>

            </div>

        </div>

    </div>

    <div class="popup_alert">

        <div id="popup_alert">

            <h3 id="popup_title">Cliente Cadastrado com Sucesso!</h3>

            <span class="material-symbols-outlined" id="icon_indicator">check</span>

            <button id="close_sucess">Ok</button>

        </div>

    </div>


    <div class="header_dash_container">

        <span class="material-symbols-outlined" id="menu-toggle">menu</span>

        <h3>Cadastro Terrenos</h3>

    </div>

    <nav id="menu">

        <span class="material-symbols-outlined close-menu">close</span>

        <div style="display: flex; justify-content: center; margin-bottom: 20px;">

            <img src="../assets/logo2.png" class="logo" alt="Logo">

        </div>

        <div class="menu-item" onclick="window.location.href='../home/home.html'">
            <span class="material-symbols-outlined">home</span>
            <span class="menu-label">Empreendimento 1</span>
        </div>

        <div class="menu-item has-submenu" onclick="window.location.href='../cliente/index.html'">
            <span class="material-symbols-outlined">person</span>
            <span class="menu-label">Clientes</span>
        </div>

        <div class="menu-item" onclick="window.location.href='../corretor/index.html'">
            <span class="material-symbols-outlined">badge</span>
            <span class="menu-label">Corretores</span>
        </div>

        <div class="menu-item active">
            <span class="material-symbols-outlined">map</span>
            <span class="menu-label">Terrenos</span>
        </div>


        <div class="menu-item" onclick="window.location.href='../index.html'" id="sair">
            <span class="material-symbols-outlined">logout</span>
            <span class="menu-label">Sair</span>
        </div>

    </nav>

    <div id="popup_cadastro" style="display: none;">

        <form id="formCadastro">

            <div class="header_popup">

                <h3>Cadastro de Corretor</h3>

                <span class="material-symbols-outlined" id="close-cadastro">close</span>

            </div>

            <div class="sub">

                <div class="campo">

                    <label>Nome Completo:</label>
                    <input type="text" id="nome_completo" required>

                </div>

                <div class="campo">

                    <label>Data Nascimento</label>
                    <input type="date" id="data_nasc">

                </div>


                <div class="campo">

                    <label>CRECI:</label>
                    <input type="number" id="creci" required>

                </div>

                <div class="campo">

                    <label>CPF:</label>
                    <input type="number" id="cpf" required>

                </div>

            </div>

            <div class="sub">

                <div class="campo">

                    <label>Email:</label>
                    <input type="email" id="user" required>

                </div>

                <div class="campo">

                    <label>Senha:</label>
                    <input type="text" id="password" required>

                </div>


            </div>

            <div class="sub">


                <div class="campo">

                    <label>Conta Bancária:</label>
                    <input type="text" id="conta_banc">

                </div>

                <div class="campo">

                    <label>Agência:</label>
                    <input type="text" id="ag" required>

                </div>

                <div class="campo">

                    <label>Banco:</label>
                    <input type="text" id="bank">

                </div>

                <div class="campo">

                    <label>Chave Pix:</label>
                    <input type="text" id="pix" required>

                </div>


            </div>


            <div class="sub">

                <button type="submit">Cadastrar</button>


            </div>

        </form>


    </div>

    <!------------------------------------------------------------------------>

    <div id="popup_edit_cadastro" style="display: none;">

        <form id="formEditCadastro">

            <div class="header_popup">

                <h3 id="corretor_edit">Editar Cadastro</h3>

                <span class="material-symbols-outlined" id="close-edit">close</span>

            </div>

            <div class="sub">

                <div class="campo">

                    <label>Nome Completo:</label>
                    <input type="text" id="nome_completo_edit" required>

                </div>

                <div class="campo">

                    <label>Data Nascimento</label>
                    <input type="date" id="data_nasc_edit">

                </div>


                <div class="campo">

                    <label>CRECI:</label>
                    <input type="number" id="creci_edit" required>

                </div>

                <div class="campo">

                    <label>CPF:</label>
                    <input type="number" id="cpf_edit" required>

                </div>

                <div class="campo">

                    <label>Conta Bancária:</label>
                    <input type="text" id="conta_banc_edit">

                </div>

            </div>


            <div class="sub">


                <div class="campo">

                    <label>Agência:</label>
                    <input type="text" id="ag_edit" required>

                </div>

                <div class="campo">

                    <label>Banco:</label>
                    <input type="text" id="bank_edit">

                </div>

                <div class="campo">

                    <label>Chave Pix:</label>
                    <input type="text" id="pix_edit" required>

                </div>

                <div class="campo">

                    <label>Status:</label>

                    <select id="status_edit">

                        <option value="1">Ativo</option>
                        <option value="0">Inativo</option>

                    </select>

                </div>

                <div class="campo">

                    <label>Tipo:</label>

                    <select id="tipo_edit">

                        <option value="2">Corretor</option>
                        <option value="1">Admin</option>

                    </select>

                </div>


            </div>

            <div class="sub">

                <button type="submit">Atualizar</button>


            </div>


        </form>


    </div>


    <!------------------------------------------------------------------->


    <div class="container">

        <div class="cad">

            <input type="text" id="search_name" placeholder="Pesquisar Nome">

            <span class="material-symbols-outlined" id="open_popup">add</span>

        </div>

        <div class="card-table">


            <table id="tabelaCorretor">

                <thead>

                    <tr>
                        <th>Lote</th>
                        <th>Vendedor</th>
                        <th>Status</th>
                        <th>Ação</th>
                    </tr>

                </thead>

                <tbody>


                </tbody>

            </table>

        </div>


    </div>




</body>

</html>
